name: Release

# Etiket atinca calisir:  git tag v1.3.0 && git push origin v1.3.0
# Uc platformda birden derler ve GitHub Release'e yukler.
# macOS .dmg dosyasi da burada uretilir - Mac'e ihtiyac yok.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:

  # ------------------------------------------------------------------ Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Imza anahtari depoda degil, GitHub secret olarak tutulur.
      # Secret yoksa derleme yine calisir, debug anahtariyla imzalanir.
      - name: İmza anahtarını hazırla
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > besop-release.jks
          {
            echo "storeFile=besop-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: APK derle
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/Besop-Android-${GITHUB_REF_NAME#v}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: MSI ve taşınabilir sürüm derle
        run: ./gradlew :desktop:packageMsi :desktop:createDistributable --no-daemon
        shell: bash

      - name: Adlandır ve paketle
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp desktop/build/compose/binaries/main/msi/*.msi "out/Besop-Windows-Kurulum-$V.msi"
          cd desktop/build/compose/binaries/main/app
          7z a -tzip "$GITHUB_WORKSPACE/out/Besop-Windows-Portable-$V.zip" Besop

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: DMG derle
        run: ./gradlew :desktop:packageDmg --no-daemon

      - name: Adlandır
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp desktop/build/compose/binaries/main/dmg/*.dmg "out/Besop-macOS-$V.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg

  # ------------------------------------------------------------------ Release
  release:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dosyaları topla
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' \) \
            -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Bêşop ${{ github.ref_name }}

            | Platform | Dosya |
            |---|---|
            | Android 8.0+ | `Besop-Android-*.apk` |
            | Windows 10/11 | `Besop-Windows-Kurulum-*.msi` (kurulum) |
            | Windows (kurulumsuz) | `Besop-Windows-Portable-*.zip` |
            | macOS | `Besop-macOS-*.dmg` |

            macOS uygulaması imzasızdır: ilk açılışta sağ tık → **Aç**.

            Değişiklikler için [CHANGELOG.md](CHANGELOG.md) dosyasına bakın.
